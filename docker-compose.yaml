version: '3.8'

services:
  # The Database Service
  db:
    image: mysql:8.0
    # Use a container_name for easier reference
    container_name: borehole_db_container
    environment:
      MYSQL_ROOT_PASSWORD: iwakpeyek23
      MYSQL_DATABASE: borehole_ms
      MYSQL_USER: user
      MYSQL_PASSWORD: userpass
    ports:
      - "3308:3306"
    networks:
      # Attach to our custom network
      - borehole_net
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      # This is the most reliable healthcheck
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # The Application Service
  app:
    build:
      context: .
      # Use the diagnostic Dockerfile for now
      dockerfile: Dockerfile 
    container_name: borehole_app_container
    ports:
      - "8080:8080"
    environment:
      # DB_HOST must match the service name of the database
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: user
      DB_PASSWORD: userpass
      DB_NAME: borehole_ms
      JWT_SECRET: '@iwakpeyeK23_$$eg00p3ceL'
    networks:
      # Attach to our custom network
      - borehole_net
    depends_on:
      db:
        condition: service_healthy

# Top-level network definition
networks:
  borehole_net:
    driver: bridge

# Top-level volume definition
volumes:
  db_data: